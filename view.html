<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>View Challenge</title>
<style>
body {
    background: black;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 20px;
}
.card {
    border: 1px solid white;
    padding: 20px;
    margin-top: 30px;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
    overflow-wrap: anywhere;
    word-break: break-word;
}
.letter-body {
    white-space: pre-wrap;
    text-align: left;
    overflow-wrap: anywhere;
    word-break: break-word;
}
button {
    padding: 10px 20px;
    margin-top: 20px;
}
video {
    width: 100%;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div id="content"></div>

<script>
const container = document.getElementById("content");
let mode = localStorage.getItem("challengeMode") || "";

window.startChallenge = function() {
  mode = localStorage.getItem("challengeMode") || mode;

  if (!mode) {
    container.innerHTML = "<h3>No challenge found</h3>";
    return;
  }
  /* ================= START SCREEN ================= */

  function showStartScreen(title, startFunction) {
      container.innerHTML =
          "<h2>Dear " + title + "</h2>" +
          "<h3>Your Challenge is Unlocked</h3>" +
          "<button id='startBtn'>Start Viewing</button>";

      document.getElementById("startBtn").onclick = startFunction;
  }

  /* ================= SINGLE WRITE ================= */

  if (mode === "single") {

      const name = localStorage.getItem("singleName");
      const letter = localStorage.getItem("letter");

      if (!letter) {
          container.innerHTML = "<h3>No letter found</h3>";
      } else {

          showStartScreen(name, function () {

              container.innerHTML =
                  "<div class='card'>" +
                             "<div class='letter-body'>" + letter + "</div>" +
               "<button onclick=\"showCompletionScreen()\">Challenge Completed</button>" +
                  "</div>";
          });
      }
  }

  /* ================= SINGLE VIDEO ================= */

    else if (mode === "single-video") {

      const name = localStorage.getItem("singleName");

      if (!name) {
          container.innerHTML = "<h3>No video found</h3>";
      } else {

          showStartScreen(name, function () {

              const cloudUrl = localStorage.getItem("singleVideoUrl");

              function playWithURL(videoURL) {
                  container.innerHTML =
                      "<h2>Dear " + name + "</h2>" +
                      "<div class='card'>" +
            "<video id='myVideo' style='width:100%;background:#111;'></video>" +
                      "<br>" +
                      "<button id='playBtn' type='button' style='padding:14px 28px;margin-top:16px;background:#0d6efd;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;'>Start Video</button>" +
                      "<button id='nextBtn' type='button' style='display:none;padding:14px 28px;margin-top:16px;background:#22c55e;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;'>Challenge Completed</button>" +
                      "</div>";

                  const video = document.getElementById("myVideo");
                  const playBtn = document.getElementById("playBtn");
                  const nextBtn = document.getElementById("nextBtn");

                  video.src = videoURL;

                        
   playBtn.onclick = function () {
    if (video.requestFullscreen) {
        video.requestFullscreen().catch(function () {});
    }

    video.play().catch(function () {});
    playBtn.style.display = "none";
};
      
                  video.onended = function () {
                      playBtn.innerText = "Replay";
                      playBtn.style.display = "inline-block";
                      nextBtn.style.display = "inline-block";
                  };

                  video.onerror = function () {
                      container.innerHTML = "<h3>Video failed to load</h3>";
                  };

                  nextBtn.onclick = function () {
                      showCompletionScreen();
                  };
              }

              if (cloudUrl) {
                  playWithURL(cloudUrl);
                  return;
              }

              container.innerHTML = "<h3>No saved video found</h3>";
          });
      }
  }

/* ================= GROUP WRITE ================= */

  else if (mode === "group-write") {

      const groupName = localStorage.getItem("groupName");
      const letters = JSON.parse(localStorage.getItem("groupLetters")) || [];

      if (letters.length === 0) {
          container.innerHTML = "<h3>No letters found</h3>";
      } else {

          showStartScreen(groupName, function () {

              let index = 0;

             function showLetter() {

      const person = letters[index];

      container.innerHTML =
          "<h2>Dear " + groupName + "</h2>" +
          "<h3>" + (index + 1) + " of " + letters.length + "</h3>" +
          "<div class='card'>" +
          "<h3>" + person.name + "</h3>" +
                  "<div class='letter-body'>" + person.text + "</div>" +
          "<button id='nextBtn'></button>" +
          "</div>";

      const btn = document.getElementById("nextBtn");

      if (index === letters.length - 1)
          btn.innerText = "Challenge Completed";
      else
          btn.innerText = "Continue to Next";

      btn.onclick = function () {
          if (index === letters.length - 1)
              showCompletionScreen();
          else {
              index++;
              showLetter();
          }
      };
  }
              

              showLetter();
          });
      }
  }

  
  /* ================= GROUP VIDEO ================= */

  else if (mode === "group-video") {

      const videos = JSON.parse(localStorage.getItem("groupVideos")) || [];
      const groupName = localStorage.getItem("groupName") || "Group";

      if (videos.length === 0) {
          container.innerHTML = "<h3>No videos found</h3>";
      } else {

          showStartScreen(groupName, function () {

              let currentIndex = 0;

              function showVideo() {

                  const person = videos[currentIndex];

                  function playWithURL(videoURL) {

                      container.innerHTML =
                          "<h2>" + (currentIndex + 1) + " of " + videos.length + "</h2>" +
                          "<h3>" + person.name + "</h3>" +
                          "<div class='card'>" +
                          "<video id='myVideo' src='" + videoURL + "'></video>" +
                          "<button id='playBtn'>▶️ Start Video</button>" +
                          "<button id='nextBtn' style='display:none;'></button>" +
                          "</div>";

                      const video = document.getElementById("myVideo");
                      const playBtn = document.getElementById("playBtn");
                      const nextBtn = document.getElementById("nextBtn");

                      playBtn.onclick = function () {
                          video.requestFullscreen();
                          video.play();
                          playBtn.style.display = "none";
                      };

                      video.onended = function () {
                          playBtn.innerText = "Replay";
                          playBtn.style.display = "inline-block";

                          if (currentIndex === videos.length - 1)
                              nextBtn.innerText = "Challenge Completed";
                          else
                              nextBtn.innerText = "Continue to Next";

                          nextBtn.style.display = "inline-block";
                      };

                      nextBtn.onclick = function () {
                          if (currentIndex === videos.length - 1) {
                              showCompletionScreen();
                          } else {
                              currentIndex++;
                              showVideo();
                          }
                      };
                  }

                  // 1) Cloud URL first
                  if (person.url) {
                      playWithURL(person.url);
                      return;
                  }

                  // 2) Fallback IndexedDB
                  const request = indexedDB.open("VipsMindDB", 1);

                  request.onsuccess = function (event) {
                      const db = event.target.result;
                      const transaction = db.transaction("videos", "readonly");
                      const store = transaction.objectStore("videos");
                      const getRequest = store.get(person.id);

                      getRequest.onsuccess = function () {
                          const result = getRequest.result;
                          if (!result) {
                              container.innerHTML = "<h3>Video not found</h3>";
                              return;
                          }
                          playWithURL(URL.createObjectURL(result.blob));
                      };
                  };
              }

              showVideo();
          });
      }
  }
};

function showCompletionScreen() {

    let titleName = "";

    if (mode === "single" || mode === "single-video") {
        titleName = localStorage.getItem("singleName") || "User";
    } 
    else if (mode === "group-write" || mode === "group-video") {
        titleName = localStorage.getItem("groupName") || "Group";
    }

    container.innerHTML = `
        <h2>Dear ${titleName}</h2>
        <h3>Your Challenge Completed 🎊🎉🎊</h3>

      <div class="card">
     <button onclick="downloadContent()">Download</button>
      <button onclick="shareContent()">Share</button>
     <button onclick="window.location.href='view.html'">Replay</button>
  </div>

        <p style="margin-top:40px;opacity:0.7;">
            Thanks For Using VipsMind
        </p>
    `;
}

function drawLetterPdf(doc, name, letter) {
  const pageW = 210;
  const pageH = 297;
  const left = 25;
  const maxW = 160;
  const lineH = 7;
  const bottom = 250;

  function paper() {
    doc.setFillColor(245, 235, 200);
    doc.rect(0, 0, pageW, pageH, "F");
        doc.setFont("Times", "Italic");
    doc.setFontSize(12);
    doc.text("VIPSMIND", 105, 15, { align: "center" });
    doc.setFont("Times", "Normal");
    doc.setFontSize(14);
  }

  paper();
  doc.setFont("Times", "Bold");
  doc.setFontSize(24);
  doc.text(name, 105, 50, { align: "center" });

  doc.setFont("Times", "Normal");
  doc.setFontSize(14);
  const lines = doc.splitTextToSize(letter || "", maxW);
  let y = 80;
  for (let i = 0; i < lines.length; i++) {
    if (y > bottom) {
      doc.addPage();
      paper();
      y = 30;
    }
    doc.text(lines[i], left, y);
    y += lineH;
  }

  if (y > bottom - 16) {
    doc.addPage();
    paper();
    y = 40;
  }
  doc.setFont("Times", "Italic");
  doc.setFontSize(16);
  doc.text("- Past " + name + " -", 185, y + 16, { align: "right" });
}

function downloadContent() {

if (mode === "single") {

const name = localStorage.getItem("singleName") || "User";
const letter = localStorage.getItem("letter") || "";
const { jsPDF } = window.jspdf;
const doc = new jsPDF();
drawLetterPdf(doc, name, letter);
doc.save("VipsMind_Letter.pdf");
}
      
else if (mode === "group-write") {

const groupName = localStorage.getItem("groupName") || "Group";
const letters = JSON.parse(localStorage.getItem("groupLetters")) || [];

const { jsPDF } = window.jspdf;
const doc = new jsPDF();

letters.forEach((p, index) => {
  if (index !== 0) doc.addPage();
  drawLetterPdf(doc, p.name, p.text);
});

doc.save("VipsMind_Group_Letters.pdf");

}

else if (mode === "single-video") {

    const cloudUrl = localStorage.getItem("singleVideoUrl");
    const name = localStorage.getItem("singleName") || "Video";

    if (cloudUrl) {
      const a = document.createElement("a");
      a.href = cloudUrl;
      a.download = "VipsMind_" + name + ".webm";
      a.target = "_blank";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      return;
    }

    const request = indexedDB.open("VipsMindDB", 1);

    request.onsuccess = function (event) {
      const db = event.target.result;
      const transaction = db.transaction("videos", "readonly");
      const store = transaction.objectStore("videos");
      const getRequest = store.get("singleVideo");

      getRequest.onsuccess = function () {
        const result = getRequest.result;
        if (!result) {
          alert("Video not found");
          return;
        }

        const blob = new Blob([result.blob], { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "VipsMind_" + name + ".webm";
        document.body.appendChild(a);
        a.click();

        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 1000);
      };
    };
}

else if (mode === "group-video") {

const videos = JSON.parse(localStorage.getItem("groupVideos")) || [];
let index = 0;

function downloadNext() {

if (index >= videos.length) return;

const person = videos[index];

// Cloud URL
if (person.url) {
  const a = document.createElement("a");
  a.href = person.url;
  a.download = "VipsMind_" + person.name + ".webm";
  a.target = "_blank";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  index++;
  setTimeout(downloadNext, 1500);
  return;
}

// Fallback IndexedDB
const request = indexedDB.open("VipsMindDB", 1);

request.onsuccess = function (event) {
  const db = event.target.result;
  const transaction = db.transaction("videos", "readonly");
  const store = transaction.objectStore("videos");
  const getRequest = store.get(person.id);

  getRequest.onsuccess = function () {
    const result = getRequest.result;
    if (!result) {
      index++;
      downloadNext();
      return;
    }

    const blob = new Blob([result.blob], { type: "video/webm" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "VipsMind_" + person.name + ".webm";
    document.body.appendChild(a);
    a.click();

    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      index++;
      downloadNext();
    }, 1500);
  };
};
}

downloadNext();
}
}

function shareContent() {

    let name = "";

    if (mode === "single" || mode === "single-video") {
        name = localStorage.getItem("singleName") || "User";
    } 
    else {
        name = localStorage.getItem("groupName") || "Group";
    }

const text =
"I completed my challenge on vipsmind 🎉\n\n" +
"Try vipsmind here:\n" +
"https://vipsmind.in";

    if (navigator.share) {

        navigator.share({
            title: "VipsMind Challenge",
            text: text,
     url: "https://vipsmind.in"
        });

    } else {

        const whatsapp =
        "https://wa.me/?text=" + encodeURIComponent(text);

        window.open(whatsapp, "_blank");
   }
}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqtkCHpIelkDUsm2pPiZjmW6RqSXXGoZY",
  authDomain: "vipsmind-b34fc.firebaseapp.com",
  projectId: "vipsmind-b34fc",
  storageBucket: "vipsmind-b34fc.firebasestorage.app",
  messagingSenderId: "257825847385",
  appId: "1:257825847385:web:ee3592957535a99e915948"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadFromCloud() {
  const uid = localStorage.getItem("uid");
  if (!uid) return;

  try {
    const docRef = doc(db, "users", uid);
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
      const data = docSnap.data();
      if (data.challengeMode) localStorage.setItem("challengeMode", data.challengeMode);
      if (data.singleName) localStorage.setItem("singleName", data.singleName);
      if (data.letter) localStorage.setItem("letter", data.letter);
      if (data.groupName) localStorage.setItem("groupName", data.groupName);
      if (data.groupLetters) localStorage.setItem("groupLetters", JSON.stringify(data.groupLetters));
            if (data.groupVideos) localStorage.setItem("groupVideos", JSON.stringify(data.groupVideos));
      if (data.singleVideoUrl) localStorage.setItem("singleVideoUrl", data.singleVideoUrl);
      if (data.unlockTime) localStorage.setItem("unlockTime", data.unlockTime);
      if (data.lockTime) localStorage.setItem("lockTime", data.lockTime);
    }
  } catch (e) {
    console.log("Cloud load failed");
  }
}
loadFromCloud().then(() => {
  if (window.startChallenge) {
    window.startChallenge();
  }
});
</script>
</body>
    </html>
