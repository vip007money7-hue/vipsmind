<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Group Video</title>

<style>
body{
    margin:0;
    min-height:100vh;
    background:#000;
    color:#fff;
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:90%;
    max-width:400px;
    background:rgba(0,0,0,0.85);
    padding:20px;
    border-radius:12px;
    text-align:center;
}

input,button{
    width:100%;
    padding:10px;
    margin-top:12px;
    font-size:16px;
    border:none;
    border-radius:6px;
}

input{
    background:#fff;
    color:#000;
}

button{
    background:#0d6efd;
    color:#fff;
}

button.red{
    background:#dc3545;
}

.blurBox{
    margin-top:20px;
    padding:20px;
    background:rgba(255,255,255,0.1);
    filter:blur(4px);
}
video{
    width:100%;
    margin-top:10px;
}
/* Page Loader */
#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

.spinner{
width:40px;
height:40px;
border:4px solid rgba(255,255,255,0.2);
border-top:4px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}
</style>
</head>

<body>
<div id="loader">
<div class="spinner"></div>
</div>


<div class="box" id="mainBox">

<h2 id="stepText"></h2>

<input id="userName" placeholder="Enter your name">

<video id="preview" autoplay muted style="display:none;"></video>

<button id="recordBtn">Start Recording</button>

</div>
<!-- EXIT POPUP -->
<div id="exitPopup" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
backdrop-filter:blur(6px);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
">

  <div style="
  width:85%;
  max-width:320px;
  background:#111;
  border:1px solid #444;
  padding:20px;
  border-radius:12px;
  position:relative;
  text-align:center;
  ">

    <div onclick="closeExit()" style="
    position:absolute;
    top:10px;
    right:12px;
    font-size:18px;
    cursor:pointer;
    color:#aaa;
    ">✖</div>

    <h3>Exit Confirmation</h3>

    <p>
    Are you sure you want to exit?<br>
    Your progress will be lost.
    </p>

    <button onclick="confirmExit()" style="
    margin-top:18px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#facc15;
    color:black;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    ">
    Back
    </button>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqtkCHpIelkDUsm2pPiZjmW6RqSXXGoZY",
  authDomain: "vipsmind-b34fc.firebaseapp.com",
  projectId: "vipsmind-b34fc",
  storageBucket: "vipsmind-b34fc.firebasestorage.app",
  messagingSenderId: "257825847385",
  appId: "1:257825847385:web:ee3592957535a99e915948"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const firestoreDB = getFirestore(app);
const storage = getStorage(app);


// BACK BUTTON CONTROL (GROUP FLOW)

if (!sessionStorage.getItem("backInit")) {
    history.pushState(null, null, location.href);
    sessionStorage.setItem("backInit", "true");
}

let timerBackCount = 0;

window.addEventListener("popstate", function () {

    const popup = document.getElementById("exitPopup");
    const recordBtn = document.getElementById("recordBtn");

    // If popup already open → do nothing
    if (popup && popup.style.display === "flex") {
        return;
    }

    // TIMER SCREEN
    if (document.getElementById("unlockInput") !== null) {
        timerBackCount++;

        if (timerBackCount === 1) {
            history.pushState(null, null, location.href);
            return;
        }

        popup.style.display = "flex";
        history.pushState(null, null, location.href);
        return;
    }

    // RECORDING SCREEN
    if (recordBtn && recordBtn.innerText === "Stop Recording") {
        popup.style.display = "flex";
        history.pushState(null, null, location.href);
        return;
    }

    // NORMAL SCREEN → GO HOME
    window.location.replace("index.html");
});

const total = Number(localStorage.getItem("memberCount")) || 0;
if (!total || total <= 0) {
    alert("Invalid group setup");
    window.location.href = "group-setup.html";
}
// FIX: Proper index handling
let index = Number(localStorage.getItem("currentIndex"));
if (!index || index < 1) {
    index = 1;
    localStorage.setItem("currentIndex", 1);
}

const stepText = document.getElementById("stepText");
const recordBtn = document.getElementById("recordBtn");
const preview = document.getElementById("preview");
const userName = document.getElementById("userName");

let mediaRecorder;
let recordedChunks = [];
let stream;

/* ================= INDEXED DB SETUP ================= */
let videoDB;

const request = indexedDB.open("VipsMindDB", 1);

request.onupgradeneeded = function (event) {
    videoDB = event.target.result;
    if (!videoDB.objectStoreNames.contains("videos")) {
        videoDB.createObjectStore("videos", { keyPath: "id" });
    }
};
request.onerror = function () {
    alert("Database error. Please reload page.");
};
request.onsuccess = function (event) {
    videoDB = event.target.result;
};
/* ================= STEP TEXT ================= */

function updateStep() {
    stepText.innerText = index + " of " + total;
}
updateStep();

/* ================= RECORD BUTTON ================= */

recordBtn.onclick = async function () {

    if (!userName.value) {
        alert("Enter your name");
        return;
    }

    // START RECORDING
    if (recordBtn.innerText.includes("Start")) {

        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: true
        });

        preview.style.display = "block";
        preview.srcObject = stream;

        recordedChunks = [];

       if (MediaRecorder.isTypeSupported("video/webm;codecs=vp9")) {
    mediaRecorder = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp9" });
} else if (MediaRecorder.isTypeSupported("video/webm;codecs=vp8")) {
    mediaRecorder = new MediaRecorder(stream, { mimeType: "video/webm;codecs=vp8" });
} else {
    mediaRecorder = new MediaRecorder(stream);
}

        mediaRecorder.ondataavailable = e => {
            if (e.data && e.data.size > 0) {
                recordedChunks.push(e.data);
            }
        };

        mediaRecorder.start();
        recordBtn.innerText = "Stop Recording";

    } else {

        // STOP RECORDING
        mediaRecorder.stop();

        mediaRecorder.onstop = function () {

            stream.getTracks().forEach(track => track.stop());

         const blob = new Blob(recordedChunks, { type: "video/webm" });

            // SAVE VIDEO TO INDEXED DB
            const transaction = videoDB.transaction(["videos"], "readwrite");
            const store = transaction.objectStore("videos");
            
            store.put({
                id: "groupVideo_" + index,
                blob: blob
            });

            // Save name only in localStorage
            let videos = JSON.parse(localStorage.getItem("groupVideos") || "[]");

            videos.push({
              name: userName.value.trim(),
                id: "groupVideo_" + index
            });

            localStorage.setItem("groupVideos", JSON.stringify(videos));

            recordedChunks = [];
            showSavedScreen();
        };

        recordBtn.innerText = "Start Recording";
    }
};

/* ================= AFTER SAVE SCREEN ================= */

function showSavedScreen() {

    document.getElementById("mainBox").innerHTML = `
        <h2>${index} of ${total}</h2>
        <h3>${userName.value}</h3>

        <div class="blurBox">
            Video Saved (Locked)
        </div>

        <button id="nextBtn" style="margin-top:20px;">
            ${index === total ? "Continue to Set Unlock Timer" : "Continue to Next"}
        </button>
    `;

    document.getElementById("nextBtn").onclick = function () {

        if (index === total) {
            showTimer();
        } else {
            index++;
            localStorage.setItem("currentIndex", index);
            window.location.reload();
        }
    };
}

/* ================= TIMER SCREEN ================= */

function showTimer() {

    document.getElementById("mainBox").innerHTML = `
        <h2>${total} of ${total}</h2>
        <h2>Set one timer for whole group</h2>

        <input type="datetime-local" id="unlockInput">

        <button class="red" onclick="lockChallenge()">
            Set Unlock Timer
        </button>
    `;
}

================= LOCK CHALLENGE ================= */
async function lockChallenge() {

    const unlock = document.getElementById("unlockInput").value;

    if (!unlock) {
        alert("Select unlock time");
        return;
    }

    document.getElementById("loader").style.display = "flex";

    try {
      await auth.authStateReady();
      const user = auth.currentUser;

      if (!user) {
        alert("Session expired. Please login again.");
        window.location.replace("login.html");
        return;
      }

      const uid = user.uid;
      localStorage.setItem("uid", uid);

      const unlockTime = new Date(unlock).getTime();
      const lockTime = Date.now();
      const groupName = localStorage.getItem("groupName") || "";
      let groupVideos = JSON.parse(localStorage.getItem("groupVideos") || "[]");

      // Upload each video from IndexedDB to Firebase Storage
      const uploadedVideos = [];

      for (let i = 0; i < groupVideos.length; i++) {
        const item = groupVideos[i];

        const blob = await new Promise((resolve, reject) => {
          const tx = videoDB.transaction(["videos"], "readonly");
          const store = tx.objectStore("videos");
          const req = store.get(item.id);
          req.onsuccess = () => resolve(req.result ? req.result.blob : null);
          req.onerror = () => reject(req.error);
        });

        if (!blob) {
          throw new Error("Video not found: " + item.id);
        }

        const storageRef = ref(storage, "videos/" + uid + "/" + item.id + ".webm");
        await uploadBytes(storageRef, blob);
        const url = await getDownloadURL(storageRef);

        uploadedVideos.push({
          name: item.name,
          id: item.id,
          url: url
        });
      }

      localStorage.setItem("lockTime", lockTime);
      localStorage.setItem("unlockTime", unlockTime);
      localStorage.setItem("challengeMode", "group-video");
      localStorage.setItem("challengeStatus", "locked");
      localStorage.setItem("groupVideos", JSON.stringify(uploadedVideos));

      await setDoc(doc(firestoreDB, "users", uid), {
        groupName: groupName,
        groupVideos: uploadedVideos,
        lockTime: lockTime,
        unlockTime: unlockTime,
        challengeMode: "group-video",
        challengeStatus: "locked",
        createdAt: Date.now()
      }, { merge: true });

      window.location.replace("goals.html");

    } catch (e) {
      document.getElementById("loader").style.display = "none";
      alert("Save failed: " + e.message);
    }
}

window.lockChallenge = lockChallenge;

window.confirmExit = function() {
    sessionStorage.removeItem("backInit");
    window.location.replace("index.html");
};

window.closeExit = function() {
    const popup = document.getElementById("exitPopup");
    if (popup) popup.style.display = "none";

    timerBackCount = 0;
};
</script>
</body>
</html>
